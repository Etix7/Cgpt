name: Build .deb and publish APT repo

# Push a tag like v0.1.0 (or run manually) to build the package and refresh the
# APT repository served from GitHub Pages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native Debian package: pure-Python, deps come from python3-* at install
      # time, so it builds fine on the Ubuntu runner and installs on Kali.
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper dh-python python3-all pybuild-plugin-pyproject \
            python3-hatchling dpkg-dev build-essential apt-utils

      - name: Build the .deb
        run: |
          set -euxo pipefail
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../claude-gpt_*.deb dist/
          ls -l dist

      - name: Assemble the APT repository
        run: |
          set -euxo pipefail
          mkdir -p public/pool/main/c/claude-gpt
          cp dist/claude-gpt_*.deb public/pool/main/c/claude-gpt/
          touch public/.nojekyll
          cd public
          # arch:all package — expose it under each supported architecture.
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            apt-ftparchive --arch "$arch" packages pool > "dists/stable/main/binary-$arch/Packages"
            gzip -kf "dists/stable/main/binary-$arch/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Claude_Gpt" \
            -o APT::FTPArchive::Release::Label="Claude_Gpt" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Claude_Gpt APT repository" \
            release dists/stable > dists/stable/Release

      # Signs the repo when a GPG key is present. Without one, the repo is still
      # published but users must add [trusted=yes] to their sources entry.
      - name: Sign the repository (if a GPG key is configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::No GPG_PRIVATE_KEY secret — publishing an UNSIGNED repo."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          PASS_ARGS=()
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            PASS_ARGS=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
          fi
          ( cd public/dists/stable
            gpg --batch --yes "${PASS_ARGS[@]}" --local-user "$KEYID" --clearsign -o InRelease Release
            gpg --batch --yes "${PASS_ARGS[@]}" --local-user "$KEYID" --detach-sign --armor -o Release.gpg Release
          )
          gpg --armor --export "$KEYID" > public/KEY.gpg
          echo "Signed the repository with key $KEYID"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
