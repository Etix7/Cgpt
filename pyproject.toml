[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Claude_Gpt"
version = "0.1.0"
description = "Claude_Gpt — a Claude-powered cybersecurity assistant for the terminal (an sgpt-style tool for security work). Installed command: claude-gpt."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Étienne Bigant", email = "etienne.bigant@gmail.com" }]
keywords = ["claude", "anthropic", "cli", "shell", "llm", "cybersecurity", "pentest", "kali", "ctf", "assistant"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
claude-gpt = "cgpt.cli:app"

[project.urls]
Homepage = "https://github.com/Etix7/Cgpt"

[tool.hatchling.build.targets.wheel]
packages = ["cgpt"]
